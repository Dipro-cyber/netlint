! edge_subinterfaces.cfg
! Router-on-a-stick with subinterfaces (dot1q encapsulation).
! Subinterface names contain dots: GigabitEthernet0/0.10
! These must not crash the parser or produce false duplicate-IP findings.
! The parent interface (Gi0/0) has no IP — only subinterfaces do.

hostname ROAS-ROUTER
service password-encryption
ip ssh version 2
!
vlan 10
 name DATA
!
vlan 20
 name VOICE
!
vlan 30
 name MGMT
!
interface GigabitEthernet0/0
 description Trunk to switch — no IP on parent
 no shutdown
!
interface GigabitEthernet0/0.10
 description Data VLAN subinterface
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0.20
 description Voice VLAN subinterface
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0.30
 description Management VLAN subinterface
 encapsulation dot1Q 30
 ip address 10.30.30.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description WAN uplink
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface Loopback0
 description Router-ID
 ip address 10.255.0.1 255.255.255.255
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ip access-list extended VTY_ACCESS
 10 permit tcp 10.30.30.0 0.0.0.255 any eq 22
 20 deny   ip any any
!
line vty 0 4
 transport input ssh
 access-class VTY_ACCESS in
 login local
 exec-timeout 10 0
!
end
