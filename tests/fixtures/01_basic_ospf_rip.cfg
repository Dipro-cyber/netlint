!
! NetLint lab config
! Adapted from Cisco IOS XE OSPF documentation.
!
hostname NL-OSPF-RIP-01
!
interface Ethernet0
 description OSPF LAN
 ip address 10.93.10.1 255.255.255.0
 ip ospf cost 10
!
interface Ethernet1
 description RIP LAN
 ip address 10.94.20.1 255.255.255.0
!
router ospf 9100
 network 10.93.0.0 0.0.255.255 area 0
 redistribute rip metric 10 subnets
!
router rip
 version 2
 network 10.94.0.0
 redistribute ospf 9100
 default-metric 5
!
end
