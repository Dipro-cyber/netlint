! proposed.cfg
! Based on clean.cfg with deliberate changes:
!   - VLAN 40 added (new, undefined in interface access assignments would be fine)
!   - VLAN 99 added in DB (fixes undefined VLAN if an interface used it)
!   - GigabitEthernet0/0 IP changed (modified interface)
!   - GigabitEthernet0/4 added (new interface)
!   - ip http server added (new risk: SEC002)
!   - VTY transport changed to ssh telnet (new risk: SEC001)

version 15.4
hostname CORE-SW-01
!
vlan 10
 name MANAGEMENT
!
vlan 20
 name SERVERS
!
vlan 30
 name USERS
!
vlan 40
 name GUEST
!
ip routing
!
interface Loopback0
 description Router-ID loopback
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Uplink to ISP
 ip address 203.0.113.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Link to DIST-SW-01
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description Access port — Finance
 switchport access vlan 30
 no shutdown
!
interface GigabitEthernet0/3
 description Trunk to distribution layer
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
!
interface GigabitEthernet0/4
 description New uplink to DR site
 ip address 10.10.0.1 255.255.255.252
 no shutdown
!
interface Vlan10
 description Management SVI
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description Servers SVI
 ip address 10.20.20.1 255.255.255.0
 no shutdown
!
ip http server
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 10.30.0.0 255.255.0.0 10.0.0.2
ip route 10.40.0.0 255.255.0.0 10.10.0.2
!
ip access-list extended MGMT_ACCESS
 10 permit tcp 10.10.10.0 0.0.0.255 any eq 22
 20 deny   ip any any
!
line vty 0 4
 transport input ssh telnet
 access-class MGMT_ACCESS in
 login local
 exec-timeout 10 0
!
end
