! VLAN fixture
! Contains interfaces referencing VLANs that are not defined globally
! VLAN 99 is used on access ports but never declared with a vlan block

hostname VLAN-SW-01
!
vlan 10
 name DATA
!
vlan 20
 name VOICE
!
! Note: VLAN 99 is intentionally NOT defined here
!
interface GigabitEthernet0/0
 description Data port
 switchport access vlan 10
 no shutdown
!
interface GigabitEthernet0/1
 description Voice port
 switchport access vlan 20
 no shutdown
!
interface GigabitEthernet0/2
 description Undefined VLAN — should trigger rule
 switchport access vlan 99
 no shutdown
!
interface GigabitEthernet0/3
 description Trunk port
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 no shutdown
!
interface GigabitEthernet0/4
 description Trunk with undefined VLAN in allowed list
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface Vlan10
 description Data SVI
 ip address 10.10.0.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description Voice SVI
 ip address 10.20.0.1 255.255.255.0
 no shutdown
!
line vty 0 4
 transport input ssh
 login local
!
end
