! edge_vty_multi.cfg
! Multiple VTY sections — common on high-end routers.
! VTY 0-4: SSH only, with ACL
! VTY 5-15: SSH only, same ACL  
! Console line: no transport statement (not VTY, should be ignored)
! Aux line: present but ignored
! Also tests: exec-timeout 0 0 (infinite — unusual but valid)

hostname MULTI-VTY-ROUTER
!
ip access-list standard MGMT_ACL
 permit 10.0.0.0 0.0.0.255
 deny   any
!
interface GigabitEthernet0/0
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
line con 0
 logging synchronous
 exec-timeout 10 0
!
line aux 0
 transport input none
!
line vty 0 4
 access-class MGMT_ACL in
 exec-timeout 10 0
 transport input ssh
 login local
!
line vty 5 15
 access-class MGMT_ACL in
 exec-timeout 10 0
 transport input ssh
 login local
!
end
