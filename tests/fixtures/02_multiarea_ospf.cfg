!
! NetLint lab config
! Multi-area OSPF example inspired by Cisco documentation.
!
hostname NL-MULTIAREA-01
!
interface Ethernet0
 description Area-10 LAN
 ip address 172.20.10.5 255.255.255.0
!
interface Ethernet1
 description Area-20 LAN
 ip address 172.20.20.5 255.255.255.0
!
interface Ethernet2
 description Area-20 LAN-2
 ip address 172.20.20.7 255.255.255.0
!
interface Ethernet3
 description Area-30 LAN
 ip address 172.20.30.5 255.255.255.0
!
interface Ethernet4
 description Backbone LAN
 ip address 172.20.40.1 255.255.255.0
!
router ospf 110
 network 172.20.10.0 0.0.0.255 area 10
 network 172.20.20.0 0.0.0.255 area 20
 network 172.20.30.0 0.0.0.255 area 30
 network 172.20.40.0 0.0.0.255 area 0
!
end
