!
! NetLint lab config
! OSPF backbone router.
!
hostname NL-ROUTER-D
!
interface Ethernet4
 description Backbone LAN
 ip address 10.20.0.4 255.255.255.0
!
interface Serial1
 description Backbone transit
 ip address 10.10.2.4 255.255.255.0
!
router ospf 50
 network 10.10.2.0 0.0.0.255 area 0
 network 10.20.0.0 0.0.0.255 area 0
!
end
