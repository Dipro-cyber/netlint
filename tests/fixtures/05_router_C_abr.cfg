!
! NetLint lab config
! OSPF Area Border Router (ABR).
!
hostname NL-ROUTER-C-ABR
!
interface Ethernet3
 description Area-1 side
 ip address 10.10.1.3 255.255.255.0
!
interface Serial0
 description Backbone side
 ip address 10.10.2.3 255.255.255.0
!
router ospf 19
 network 10.10.1.0 0.0.0.255 area 1
 network 10.10.2.0 0.0.0.255 area 0
!
end
