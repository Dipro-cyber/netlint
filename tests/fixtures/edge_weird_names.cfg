! edge_weird_names.cfg
! Unusual interface names that real IOS devices produce:
!   - Port-channel (LAG)
!   - Tunnel interfaces
!   - BVI (Bridge Virtual Interface)
!   - Dialer
!   - Serial with slot/port/channel notation (Serial1/0:0)
!   - Multilink
!   - Null interface
!   - Abbreviated names: Gi, Fa, Te, Se, Lo, Tu, Po

hostname WEIRD-NAMES-ROUTER
!
interface Null0
 no ip unreachables
!
interface Loopback0
 description Router-ID
 ip address 10.255.0.1 255.255.255.255
!
interface Loopback100
 description BGP next-hop
 ip address 10.255.100.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Physical uplink
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAG member — no IP, should not cause issues
 channel-group 1 mode active
 no shutdown
!
interface GigabitEthernet0/2
 description LAG member 2 — no IP
 channel-group 1 mode active
 no shutdown
!
interface Port-channel1
 description LAG bundle
 ip address 10.1.0.1 255.255.255.252
 no shutdown
!
interface Tunnel0
 description GRE tunnel to remote site
 ip address 172.16.0.1 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel destination 198.51.100.1
 no shutdown
!
interface Serial1/0
 description Legacy WAN link
 ip address 10.2.0.1 255.255.255.252
 encapsulation ppp
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 192.168.100.0 255.255.255.0 Tunnel0
!
line vty 0 4
 transport input ssh
 login local
!
end
