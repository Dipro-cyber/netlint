! Duplicate IP address fixture
! GigabitEthernet0/0 and GigabitEthernet0/2 share 10.0.0.1/30
! GigabitEthernet0/1 and Loopback1 share 192.168.1.1/24

hostname DUP-IP-ROUTER
!
interface GigabitEthernet0/0
 description First interface — IP will be duplicated
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Second interface
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description Duplicate of Gi0/0 IP
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface Loopback0
 description Management loopback
 ip address 10.255.0.1 255.255.255.255
!
interface Loopback1
 description Duplicate of Gi0/1 IP
 ip address 192.168.1.1 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 10.0.0.2
!
line vty 0 4
 transport input ssh telnet
 login local
!
end
