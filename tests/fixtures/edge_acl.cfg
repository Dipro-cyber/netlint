! edge_acl.cfg
! ACL edge cases:
!   - Named standard ACL
!   - Named extended ACL with all protocol forms
!   - Numbered standard ACL (1–99)
!   - Numbered extended ACL (100–199)
!   - ACL with 'host' keyword source/destination
!   - ACL with 'any' as both source and destination (overly broad)
!   - ACL with port ranges
!   - ACL with ICMP type
!   - Empty ACL (no entries — unusual but valid)
!   - ACL with sequence numbers out of order
!   - Remark lines (should not crash)

hostname ACL-ROUTER
!
! Standard named ACL
ip access-list standard MGMT_HOSTS
 10 permit 10.0.0.0 0.0.0.255
 20 permit host 192.168.1.100
 30 deny   any
!
! Extended named ACL — various protocol forms
ip access-list extended INBOUND_POLICY
 10 permit tcp 10.0.0.0 0.0.255.255 any eq 22
 20 permit tcp 10.0.0.0 0.0.255.255 any eq 443
 30 permit tcp 10.0.0.0 0.0.255.255 any range 8080 8090
 40 permit udp any host 8.8.8.8 eq 53
 50 permit icmp any any echo
 60 permit icmp any any echo-reply
 70 deny   ip any any
!
! Numbered standard ACL
access-list 10 permit 10.0.0.0 0.0.0.255
access-list 10 permit 172.16.0.0 0.0.255.255
access-list 10 deny   any
!
! Numbered extended ACL
access-list 100 permit tcp 10.0.0.0 0.0.0.255 any eq 80
access-list 100 permit tcp 10.0.0.0 0.0.0.255 any eq 443
access-list 100 deny   ip any any
!
! Overly broad ACL — permit any any (no rule flags this yet, just testing parse)
ip access-list extended PERMIT_ALL
 10 permit ip any any
!
! Empty ACL (no entries — unusual but valid IOS config)
ip access-list extended EMPTY_ACL
!
! Remark lines — must not crash parser
ip access-list extended WITH_REMARKS
 remark Allow management traffic
 10 permit tcp 10.0.0.0 0.0.0.255 any eq 22
 remark Block everything else
 20 deny ip any any
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.2 255.255.255.252
 ip access-group INBOUND_POLICY in
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
line vty 0 4
 transport input ssh
 access-class MGMT_HOSTS in
 login local
!
end
