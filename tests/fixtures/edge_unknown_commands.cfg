! edge_unknown_commands.cfg
! Config full of valid IOS commands that netlint does not parse.
! None should cause a crash or false positive.
! Tests that the tokenizer's "unknown commands are silently skipped" path works.

hostname UNKNOWN-CMD-ROUTER
!
version 15.4
service timestamps log datetime msec localtime show-timezone
service timestamps debug datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
!
boot-start-marker
boot-end-marker
!
aaa new-model
aaa authentication login default local
aaa authentication login CONSOLE none
aaa authorization exec default local if-authenticated
aaa accounting exec default start-stop group tacacs+
!
clock timezone EST -5 0
clock summer-time EDT recurring
!
ip domain-name corp.example.com
ip name-server 8.8.8.8
ip name-server 8.8.4.4
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh source-interface Loopback0
!
crypto key generate rsa general-keys modulus 2048
!
ntp server 216.239.35.0 prefer
ntp server 216.239.35.4
!
snmp-server trap-source Loopback0
snmp-server enable traps snmp authentication
!
logging buffered 16384 debugging
logging console critical
logging trap informational
logging source-interface Loopback0
logging host 10.0.0.100
!
ip flow-export source Loopback0
ip flow-export version 9
ip flow-export destination 10.0.0.200 2055
!
banner motd ^
Authorized access only. Violators will be prosecuted.
^
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.2 255.255.255.252
 ip flow ingress
 ip flow egress
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.0.0.1 255.255.255.0
 no ip proxy-arp
 no shutdown
!
interface Loopback0
 description Router-ID and mgmt source
 ip address 10.255.0.1 255.255.255.255
!
router ospf 1
 router-id 10.255.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.0.0.0 0.0.0.255 area 0
 network 10.255.0.1 0.0.0.0 area 0
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ip access-list extended VTY_FILTER
 10 permit tcp 10.0.0.0 0.0.0.255 any eq 22
 20 deny   ip any any
!
line con 0
 login authentication CONSOLE
 exec-timeout 5 0
 logging synchronous
!
line vty 0 4
 access-class VTY_FILTER in
 exec-timeout 10 0
 transport input ssh
 login local
!
line vty 5 15
 access-class VTY_FILTER in
 exec-timeout 10 0
 transport input ssh
 login local
!
no ip http server
no ip http secure-server
!
end
