! Routing fixture
! Contains multiple static routes including:
!   - Two default routes (should flag conflict)
!   - Overlapping /16 and /24 subnets
!   - A floating static with high admin distance

hostname ROUTING-ROUTER
!
interface GigabitEthernet0/0
 description Primary uplink — ISP-A
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Secondary uplink — ISP-B (backup)
 ip address 198.51.100.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description Internal LAN
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description Router-ID
 ip address 10.255.0.1 255.255.255.255
!
! Primary default route via ISP-A
ip route 0.0.0.0 0.0.0.0 203.0.113.1
! Backup default route via ISP-B with higher admin distance (floating static)
ip route 0.0.0.0 0.0.0.0 198.51.100.1 200
!
! Specific routes
ip route 10.10.0.0 255.255.0.0 10.0.0.2
ip route 10.10.1.0 255.255.255.0 10.0.0.2
ip route 172.16.0.0 255.255.0.0 10.0.0.2
ip route 172.16.100.0 255.255.255.0 10.0.0.2
!
! Route via exit interface only (no next-hop)
ip route 192.168.99.0 255.255.255.0 GigabitEthernet0/2
!
ip access-list extended INBOUND
 10 permit ip 10.0.0.0 0.255.255.255 any
 20 permit ip 172.16.0.0 0.0.255.255 any
 30 deny ip any any
!
line vty 0 4
 transport input ssh
 login local
 exec-timeout 5 0
!
end
