! edge_overlapping_slash30.cfg
! Tests precise subnet overlap calculation with /30 and /29 networks.
!
! 10.0.0.0/29 (10.0.0.0 – 10.0.0.7) CONTAINS 10.0.0.0/30 (10.0.0.0 – 10.0.0.3)
! These genuinely overlap and NET002 SHOULD fire.
!
! 10.0.0.4/30 and 10.0.0.0/30 are ADJACENT (not overlapping) — NET002 must NOT fire.
!
! /32 host route vs /24: 10.1.1.1/32 is inside 10.1.1.0/24 — DOES overlap.

hostname OVERLAP-PRECISE-ROUTER
!
interface GigabitEthernet0/0
 description /29 supernet — overlaps with Gi0/1
 ip address 10.0.0.1 255.255.255.248
 no shutdown
!
interface GigabitEthernet0/1
 description /30 subnet inside the /29 above — OVERLAPS
 ip address 10.0.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description Adjacent /30 — does NOT overlap Gi0/1
 ip address 10.0.0.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description /24 containing a loopback /32 — OVERLAPS with Lo1
 ip address 10.1.1.254 255.255.255.0
 no shutdown
!
interface Loopback0
 description /32 host — unique, no overlap
 ip address 10.255.0.1 255.255.255.255
!
interface Loopback1
 description /32 inside Gi0/3 /24 — OVERLAPS
 ip address 10.1.1.1 255.255.255.255
!
ip route 0.0.0.0 0.0.0.0 10.0.0.6
!
line vty 0 4
 transport input ssh
 login local
!
end
