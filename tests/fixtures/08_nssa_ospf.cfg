!
! NetLint lab config
! OSPF NSSA lab example.
!
hostname NL-NSSA-01
!
interface Loopback1
 description OSPF Router-ID
 ip address 10.255.1.1 255.255.255.255
!
interface Ethernet0
 description NSSA transit
 ip address 192.0.2.5 255.255.255.0
 ip ospf 1 area 10
!
router ospf 1
 router-id 10.255.1.1
 area 10 nssa
 log-adjacency-changes
!
end
