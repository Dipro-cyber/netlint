! edge_secondary_ip.cfg
! Interface with a primary IP and a secondary IP.
! The secondary keyword must not cause a false duplicate-IP finding.
! Also tests: two interfaces in same /24 with different host bits
!             (should NOT be flagged as overlapping — they ARE the same /24
!              which is handled by the "identical network" skip in NET002).

hostname SECONDARY-ROUTER
!
interface GigabitEthernet0/0
 description LAN with primary and secondary IPs
 ip address 10.0.0.1 255.255.255.0
 ip address 10.0.1.1 255.255.255.0 secondary
 no shutdown
!
interface GigabitEthernet0/1
 description WAN
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
! Verify: 10.0.0.1 and 10.0.1.1 are in different /24s — no overlap should fire.
! Verify: secondary keyword on same interface does not cause duplicate-IP.
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
line vty 0 4
 transport input ssh
 login local
!
end
