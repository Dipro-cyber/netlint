!
! NetLint lab config
! OSPF ASBR with external BGP redistribution.
!
hostname NL-ROUTER-E-ASBR
!
interface Ethernet5
 description Internal backbone
 ip address 10.20.0.5 255.255.255.0
!
interface Serial2
 description External BGP peer
 ip address 172.31.1.5 255.255.255.0
!
router ospf 6501
 network 10.20.0.0 0.0.0.255 area 0
 redistribute bgp 6501 metric 10 metric-type 1
!
router bgp 6501
 network 172.30.0.0 mask 255.255.0.0
 network 10.20.0.0 mask 255.255.255.0
 neighbor 172.31.1.6 remote-as 6510
!
end
