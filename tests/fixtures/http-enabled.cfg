! http-enabled.cfg
! Router with insecure HTTP management server enabled.
! Also has Telnet on VTY for combined security-rule testing.

hostname HTTP-ROUTER
!
interface GigabitEthernet0/0
 description Uplink
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
! Plain HTTP server — should trigger SEC-002
ip http server
!
! HTTPS is also enabled — should NOT trigger SEC-002 on its own
ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
line vty 0 4
 transport input telnet ssh
 login local
!
end
