! Malformed configuration fixture
! Tests that the parser does not crash and records warnings for bad input

hostname MALFORMED-ROUTER
!
! Interface with missing subnet mask argument
interface GigabitEthernet0/0
 description Incomplete IP config
 ip address 10.0.0.1
 no shutdown
!
! Interface with a non-existent mask
interface GigabitEthernet0/1
 description Bad subnet mask
 ip address 192.168.1.1 255.255.999.0
 no shutdown
!
! Interface with garbage IP
interface GigabitEthernet0/2
 description Garbage IP address
 ip address NOT_AN_IP 255.255.255.0
 no shutdown
!
! Malformed static route — missing next-hop
ip route 10.0.0.0 255.255.255.0
!
! Malformed static route — bad mask
ip route 172.16.0.0 999.255.0.0 10.0.0.1
!
! Numbered ACL with non-numeric number
access-list BADNUM permit ip any any
!
! ACL with unknown action
ip access-list extended BAD_ACL
 10 frobnicate ip any any
!
! VTY with bad range
line vty bad_range
 transport input ssh
!
! Valid VTY block following the bad one (parser should recover)
line vty 0 4
 transport input ssh
 login local
!
end
