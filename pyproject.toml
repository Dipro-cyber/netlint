[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netlint"
version = "0.1.0"
description = "Static analyzer for network device configuration files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["network", "lint", "cisco", "ios", "configuration", "static-analysis", "cli"]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.4",
]

[project.scripts]
netlint = "netlint.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pydantic",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netlint"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
]
ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"] # allow assert and skip annotations in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/netlint"]
omit = ["src/netlint/cli.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
pretty = true
show_error_codes = true
exclude = ["tests/"]
